<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌴 Rodney Beach Rush</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #000;
    }

    #gameContainer {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* UI Overlay */
    #uiOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      font-size: 18px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      font-weight: bold;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 20px;
    }

    .speedometer {
      font-size: 32px;
      text-align: right;
    }

    .position-info {
      font-size: 24px;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 8px;
    }

    .lap-info {
      font-size: 20px;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 8px;
    }

    #timerInfo {
      font-size: 24px;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 8px;
    }

    .pause-button {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      font-size: 18px;
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
      color: #333;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      pointer-events: all;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .pause-button:hover {
      transform: scale(1.05);
    }

    .pause-button:active {
      transform: scale(0.98);
    }

    /* Menu Screen */
    .menu-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #006994 0%, #00a8cc 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: all;
    }

    .menu-screen.hidden {
      display: none;
      pointer-events: none;
    }

    .menu-content {
      text-align: center;
    }

    .menu-logo {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .menu-title {
      font-size: 48px;
      font-weight: bold;
      color: white;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
      margin-bottom: 10px;
    }

    .menu-subtitle {
      font-size: 20px;
      color: #ffffcc;
      margin-bottom: 40px;
    }

    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 30px;
    }

    .menu-button {
      padding: 20px 30px;
      font-size: 22px;
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
      color: #333;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      min-height: 60px;
      pointer-events: all;
    }

    .menu-button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .menu-button:active {
      transform: scale(0.98);
    }

    .menu-info {
      font-size: 16px;
      color: #ffffcc;
    }

    /* Loading screen */
    .loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e90ff 0%, #00bfff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      pointer-events: all;
    }

    .loading-screen.hidden {
      display: none;
      pointer-events: none;
    }

    .loading-logo {
      font-size: 100px;
      margin-bottom: 20px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 24px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    .loading-bar {
      width: 200px;
      height: 30px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 15px;
      overflow: hidden;
      border: 3px solid white;
    }

    .loading-progress {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffed4e);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Pause screen */
    .pause-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 150;
      pointer-events: all;
    }

    .pause-overlay.active {
      display: flex;
    }

    .pause-menu {
      background: linear-gradient(135deg, #006994 0%, #00a8cc 100%);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .pause-title {
      font-size: 48px;
      color: white;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .pause-buttons {
      display: flex;
      gap: 15px;
      flex-direction: column;
    }

    .pause-btn {
      padding: 15px 30px;
      font-size: 18px;
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
      color: #333;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      min-width: 200px;
      transition: all 0.3s ease;
    }

    .pause-btn:hover {
      transform: scale(1.05);
    }

    /* Finish screen */
    .finish-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a5f7a 0%, #2d9cdb 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 120;
      pointer-events: all;
    }

    .finish-screen.active {
      display: flex;
    }

    .finish-content {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 20px;
    }

    .finish-title {
      font-size: 56px;
      color: #ffd700;
      margin-bottom: 20px;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
    }

    .finish-stats {
      font-size: 24px;
      color: white;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .finish-button {
      padding: 15px 40px;
      font-size: 20px;
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
      color: #333;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .finish-button:hover {
      transform: scale(1.05);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .menu-title {
        font-size: 36px;
      }

      .menu-button {
        font-size: 18px;
        padding: 15px 25px;
        min-height: 50px;
      }

      .hud-top, .hud-bottom {
        font-size: 14px;
      }

      .speedometer {
        font-size: 20px;
      }

      .pause-button {
        padding: 10px 15px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
      <div class="loading-logo">🌴</div>
      <div class="loading-text">Loading the island…</div>
      <div class="loading-bar">
        <div class="loading-progress" id="loadingProgress"></div>
      </div>
      <div class="loading-text" style="font-size: 14px; margin-top: 20px;">🌴 ☀️ 🌊</div>
    </div>

    <!-- Main Menu -->
    <div id="mainMenu" class="menu-screen">
      <div class="menu-content">
        <div class="menu-logo">🌴</div>
        <div class="menu-title">RODNEY<br>BEACH RUSH</div>
        <div class="menu-subtitle">"Relax, Race, and Enjoy the Ride."</div>
        
        <div class="menu-buttons">
          <button class="menu-button" onclick="startGame()">▶ PLAY</button>
          <button class="menu-button" onclick="showStages()">🏝️ STAGES</button>
          <button class="menu-button" onclick="showSettings()">⚙️ SETTINGS</button>
          <button class="menu-button" onclick="showHowToPlay()">❓ HOW TO PLAY</button>
        </div>

        <div class="menu-info">
          A relaxing 3-lap beach race • Best enjoyed in landscape 📱
        </div>
      </div>
    </div>

    <!-- Pause Overlay -->
    <div id="pauseOverlay" class="pause-overlay">
      <div class="pause-menu">
        <div class="pause-title">⏸ PAUSED</div>
        <div class="pause-buttons">
          <button class="pause-btn" onclick="resumeGame()">▶ RESUME</button>
          <button class="pause-btn" onclick="backToMenu()">🏠 MAIN MENU</button>
        </div>
      </div>
    </div>

    <!-- Finish Screen -->
    <div id="finishScreen" class="finish-screen">
      <div class="finish-content">
        <div class="finish-title">🏁 FINISHED!</div>
        <div class="finish-stats">
          <div id="finishPosition">Position: 1st</div>
          <div id="finishTime">Time: 02:35</div>
          <div id="finishCoins">Coins Collected: 0</div>
        </div>
        <button class="finish-button" onclick="playAgain()">PLAY AGAIN</button>
      </div>
    </div>

    <!-- Game HUD -->
    <div id="uiOverlay">
      <div class="hud-top">
        <div class="position-info" id="positionInfo">P1 / 4</div>
        <div class="lap-info" id="lapInfo">LAP 1/3</div>
        <button class="pause-button" onclick="pauseGame()">⏸ PAUSE</button>
      </div>

      <div class="hud-bottom">
        <div id="timerInfo">00:00</div>
        <div class="speedometer" id="speedometer">0 km/h</div>
      </div>
    </div>
  </div>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Game Modules -->
  <script src="src/sim.js"></script>
  <script src="src/client/world.js"></script>
  <script src="src/client/audio.js"></script>
  <script src="src/client/main.js"></script>

  <script>
    // Global game controller
    let game = null;

    // Menu Functions
    function startGame() {
      if (game) {
        game.startGame();
      }
    }

    function showStages() {
      alert('🏝️ STAGES\n\nTraditional Beach Circuit:\n\nSTART → Tropical Beach → Palm Tree Road → Gentle Corner → Wooden Bridge → Small Ramp → Forest Road → Ocean View → Beach Road → FINISH\n\nMore stages coming soon!');
    }

    function showSettings() {
      if (game) {
        const difficulty = game.settings.difficulty.toUpperCase();
        const assist = game.settings.drivingAssist ? 'ON' : 'OFF';
        const sound = game.settings.soundEnabled ? 'ON' : 'OFF';
        const graphics = game.settings.graphicsQuality.toUpperCase();
        alert(`⚙️ SETTINGS\n\nDifficulty: ${difficulty}\nDriving Assist: ${assist}\nSound: ${sound}\nGraphics: ${graphics}\n\nSettings saved to device.`);
      }
    }

    function showHowToPlay() {
      alert('❓ HOW TO PLAY\n\nCONTROLS:\n⬆ Accelerate\n⬇ Brake\n⬅➡ Steer\nSpace = Brake\nP = Pause\n\nSPEED SETTINGS:\n🐢 CALM: ~45 km/h (relaxed)\n🏃 NORMAL: ~56 km/h (balanced)\n🚀 FAST: ~67 km/h (competitive)\n\nDRIVING ASSIST:\nON (default) - helps you stay on track\nOFF - full manual control\n\nRace 3 laps against your opponents!');
    }

    function pauseGame() {
      if (game && game.gameState === 'racing') {
        game.gameState = 'paused';
        document.getElementById('pauseOverlay').classList.add('active');
        if (game.audio) {
          game.audio.setVolume(0.3);
        }
      }
    }

    function resumeGame() {
      if (game) {
        game.gameState = 'racing';
        document.getElementById('pauseOverlay').classList.remove('active');
        if (game.audio) {
          game.audio.setVolume(0.7);
        }
      }
    }

    function backToMenu() {
      if (game) {
        game.audio.stopMusic();
        game.gameState = 'menu';
        document.getElementById('pauseOverlay').classList.remove('active');
        document.getElementById('mainMenu').classList.remove('hidden');
        game.race.reset();
      }
    }

    function playAgain() {
      if (game) {
        document.getElementById('finishScreen').classList.remove('active');
        game.race.reset();
        game.startGame();
      }
    }

    // Initialize game on load
    window.addEventListener('load', () => {
      // Show loading screen
      const loadingScreen = document.getElementById('loadingScreen');
      const loadingProgress = document.getElementById('loadingProgress');
      let progress = 0;

      const progressInterval = setInterval(() => {
        progress += Math.random() * 20;
        if (progress > 90) progress = 90;
        loadingProgress.style.width = progress + '%';
      }, 200);

      // Initialize game
      setTimeout(() => {
        try {
          game = new GameController();
          progress = 100;
          loadingProgress.style.width = '100%';
          clearInterval(progressInterval);

          setTimeout(() => {
            loadingScreen.classList.add('hidden');
          }, 500);
        } catch (e) {
          console.error('Game initialization failed:', e);
          clearInterval(progressInterval);
          alert('Error initializing game. Please refresh the page.');
        }
      }, 500);
    });

    // Handle visibility change
    document.addEventListener('visibilitychange', () => {
      if (game && game.gameState === 'racing') {
        pauseGame();
      }
    });
  </script>
</body>
</html>
